name: Integration Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-integration-tests:
    strategy:
      matrix:
        react-version: [18, 19]
    runs-on: ubuntu-latest
    name: React ${{ matrix.react-version }}
    steps:
      - name: Checkout Latest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"
          scope: "@knocklabs"
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Build Packages
        run: yarn build:packages
      - name: Run Integration Tests
        env:
          REACT_VERSION: ${{ matrix.react-version }}
          INTEGRATION_KNOCK_PUBLIC_KEY: ${{ secrets.INTEGRATION_KNOCK_PUBLIC_KEY }}
          INTEGRATION_KNOCK_USER_ID: ${{ secrets.INTEGRATION_KNOCK_USER_ID }}
          INTEGRATION_KNOCK_FEED_ID: ${{ secrets.INTEGRATION_KNOCK_FEED_ID }}
        run: yarn "test:integration:react-$REACT_VERSION"
